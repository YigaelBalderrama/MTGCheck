<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Magic Card Scanner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="shell">
      <section class="scanner-panel" aria-labelledby="page-title">
        <div class="copy">
          <p class="eyebrow">Magic: The Gathering</p>
          <h1 id="page-title">Card Scanner</h1>
          <p class="summary">
            Upload a clear photo of one or more cards. The scanner will detect card
            borders, read title text, and match recognized names.
          </p>
        </div>

        <form id="recognition-form" class="upload-card" data-endpoint="/api/cards/recognize">
          <label id="drop-zone" class="drop-zone" for="image-input">
            <input id="image-input" name="image" type="file" accept="image/png,image/jpeg,image/webp">
            <span class="mana-orbit" aria-hidden="true">
              <span class="mana-dot mana-dot-white"></span>
              <span class="mana-dot mana-dot-blue"></span>
              <span class="mana-dot mana-dot-black"></span>
              <span class="mana-dot mana-dot-red"></span>
              <span class="mana-dot mana-dot-green"></span>
            </span>
            <span class="drop-title">Choose or drop an image</span>
            <span class="drop-hint">PNG, JPG, or WEBP</span>
          </label>

          <div class="preview-frame">
            <img id="preview-image" alt="Selected upload preview">
            <div id="empty-preview" class="empty-preview">
              <span class="magic-word">Magic</span>
              <span>The Gathering</span>
            </div>
          </div>

          <button id="submit-button" class="primary-action" type="submit">
            Recognize Cards
          </button>
        </form>
      </section>

      <section class="results-panel" aria-labelledby="results-title">
        <div class="results-header">
          <div>
            <p class="eyebrow">Result</p>
            <h2 id="results-title">Detected Cards</h2>
          </div>
          <div id="status-pill" class="status-pill">Waiting for image</div>
        </div>

        <div id="message" class="message" role="status"></div>
        <div id="metrics" class="metrics" aria-live="polite"></div>
        <div id="cards-grid" class="cards-grid"></div>
      </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
