services:
  - type: web
    name: mtg-viewer-api
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_APP
        value: run.py
      - key: CARD_LOOKUP_MODE
        value: scryfall_api
      - key: OCR_GPU
        value: false
      - key: OCR_PRELOAD
        value: true
      - key: OCR_MODEL_STORAGE_DIR
        value: /app/easyocr-models
      - key: WEB_CONCURRENCY
        value: 1
      - key: GUNICORN_TIMEOUT
        value: 180
      - key: OMP_NUM_THREADS
        value: 1
      - key: MKL_NUM_THREADS
        value: 1
      - key: MAX_CARDS_PER_IMAGE
        value: 6
      - key: DETECTION_TARGET_MAX_DIMENSION
        value: 1000
      - key: CARD_WARP_WIDTH
        value: 336
      - key: CARD_WARP_HEIGHT
        value: 468
      - key: SCRYFALL_USER_AGENT
        sync: false
